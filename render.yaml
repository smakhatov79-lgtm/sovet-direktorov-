services:
    - type: web
    name: sovet-direktorov-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: sovet-db
          property: connectionString

    - type: web
    name: sovet-direktorov-front
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
            - key: REACT_APP_API_URL
        value: https://sovet-direktorov-api.onrender.com

databases:
    - name: sovet-db
    plan: free