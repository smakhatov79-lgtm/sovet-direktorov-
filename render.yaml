services:
    - type: web
    name: sovet-direktorov-api
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: DATABASE_URL
                fromDatabase:
                    name: sovet-db
                    property: connectionString
                        - key: SECRET_KEY
        generateValue: true
            - key: PYTHON_VERSION
        value: 3.11.9

    - type: web
    name: sovet-direktorov-front
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    routes:
            - type: rewrite
        source: /*
        destination: /index.html
    envVars:
            - key: REACT_APP_API_URL
        value: https://sovet-direktorov-api.onrender.com

databases:
    - name: sovet-db
    plan: free
    databaseName: sovet_db
    user: sovet_user